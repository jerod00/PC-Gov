# =============================================================================
# PC-Gov contract opportunity finder — scoring & search configuration
#
# Edit this file to tune search coverage and ranking without touching code.
# Re-run is not required to pick up changes — every run_daily.py execution
# reads this file fresh.
# =============================================================================

company:
  name: "Palcon"
  home_location:
    label: "Stephenville, TX"
    lat: 32.2207
    lon: -98.2023
  # Fed verbatim to the LLM relevance judge (see llm_scoring below) — edit
  # this over time as your product mix or exclusions change. Not used by the
  # deterministic keyword/NAICS scoring at all.
  capabilities_description: >
    Palcon is a large metal fabrication shop based in Stephenville, TX. Core
    capabilities: gas turbine ducts, air inlet filter housings, expansion
    joints, skids, and other large fabricated metal structures/assemblies.
    Palcon also offers hydrovac (vacuum) excavation services — non-destructive
    digging for utility locating/exposure, potholing, and similar site work.
    We do NOT do: retail/consumer goods, generic janitorial or facility
    maintenance, IT/software services, medical supplies, or office furniture
    — don't rate something relevant just because it mentions "steel" or
    "metal" in passing if the core scope of work is unrelated.
  # State/local opportunities outside these states are dropped before scoring
  # ever sees them. Texas is always in-radius per company judgment; the other
  # states get a per-listing haversine distance check against radius_miles.
  state_local_states:
    - TX
    - OK
    - LA
    - AR
    - NM
    - KS
    - MO
  radius_miles: 500

# -----------------------------------------------------------------------------
# Capability profile — what Pal-Con can actually manufacture/do, as a set of
# named capabilities rather than a single flat keyword/NAICS/PSC list. This
# is the primary input to the "confidence score" the matching engine builds
# per opportunity (src/scoring.py _best_capability_match): each capability
# contributes its own keyword matches, graduated NAICS/PSC/NIGP code credit
# (see scoring.capability_scoring below — an exact code match counts more
# than a same-family/group match, but a same-family match is still worth
# something, unlike the old all-or-nothing list check), and, when
# semantic_scoring is enabled, semantic similarity between the opportunity's
# text and this capability's `description`.
#
# This is ADDITIVE to (not a replacement for) the flat `keywords:` and
# `sam_gov.naics_codes`/`psc_codes` lists below, which keep working exactly
# as before — an opportunity only needs to pass ONE of: a flat keyword
# match, a flat NAICS/PSC match, a capability-profile match, or a positive
# LLM judgment, to clear the relevance gate.
#
# `description` doubles as the text embedded for semantic similarity, so
# write it the way you'd explain the capability to a person unfamiliar with
# the exact terminology a solicitation might use.
# -----------------------------------------------------------------------------
capabilities:
  - name: "Turbine ducts, filter housings & expansion joints"
    description: >
      Gas turbine inlet and exhaust ductwork, air inlet filter housings
      (filter houses), and expansion joints for turbine packages at power
      plants and industrial gas turbine installations.
    keywords:
      - "gas turbine duct"
      - "turbine duct"
      - "air inlet filter housing"
      - "inlet filter house"
      - "expansion joint"
      - "exhaust duct"
      - "inlet duct"
      - "duct"
      - "plenum"
      - "equipment housing"
      - "filter housing"
    naics_codes:
      - "332313"  # Plate Work Manufacturing (ducts, plenums, housings)
      - "336413"  # Other Aircraft Parts & Auxiliary Equipment Mfg (turbine-adjacent)
      - "333611"  # Turbine and Turbine Generator Set Units Manufacturing
    psc_codes:
      - "4730"  # Miscellaneous Pipe, Tube, Hose, and Fittings
    nigp_codes:
      - "Duct"
      - "Turbine"
      - "Filter"

  - name: "Structural steel fabrication & weldments"
    description: >
      Custom fabricated structural steel, weldments, and large fabricated
      metal structures/assemblies built to engineered drawings — structural
      steel packages, platforms, and general heavy steel fabrication work.
    keywords:
      - "structural steel fabrication"
      - "fabricated steel"
      - "metal fabrication"
      - "weldment"
      - "steel structure"
      - "platform structure"
      - "welding"
      - "steel"
      - "metal"
      - "fabrication"
      - "structural"
    naics_codes:
      - "332312"  # Fabricated Structural Metal Manufacturing
      - "332311"  # Prefabricated Metal Building and Component Manufacturing
      - "332322"  # Sheet Metal Work Manufacturing
      - "332999"  # All Other Miscellaneous Fabricated Metal Product Manufacturing
      - "238120"  # Structural Steel and Precast Concrete Contractors
    psc_codes:
      - "5410"  # Prefabricated and Portable Buildings
      - "5411"  # Prefabricated Building Modules/Sections
      - "5420"  # Bridges, Fixed and Floating
    nigp_codes:
      - "Structural Steel"
      - "Metal Fabrication"
      - "Welding"

  - name: "Equipment skids & enclosures"
    description: >
      Fabricated equipment skids and equipment enclosures/housings —
      pre-assembled mechanical/process packages mounted on a structural
      steel base for shipment and field installation.
    keywords:
      - "skid package"
      - "equipment skid"
      - "skid"
      - "equipment enclosure"
      - "enclosure"
    naics_codes:
      - "332313"  # Plate Work Manufacturing
      - "332999"  # All Other Miscellaneous Fabricated Metal Product Manufacturing
    psc_codes:
      - "5410"
      - "5411"
    nigp_codes:
      - "Skid"
      - "Equipment Enclosure"

  - name: "Tanks, pressure vessels & pipe spools"
    description: >
      Fabricated storage tanks, pressure vessels, and pipe spools built to
      engineered specifications for industrial/process facilities.
    keywords:
      - "pressure vessel"
      - "tank fabrication"
      - "pipe spool"
    naics_codes:
      - "332420"  # Metal Tank (Heavy Gauge) Manufacturing
      - "332996"  # Fabricated Pipe and Pipe Fitting Manufacturing
      - "332999"
    psc_codes:
      - "4730"
      - "3441"  # Bending and Forming Machines
    nigp_codes:
      - "Tank"
      - "Pressure Vessel"
      - "Pipe"

  - name: "Hydrovac / vacuum excavation services"
    description: >
      Hydrovac (hydro-excavation / vacuum excavation) services — non-
      destructive digging for utility locating and exposure, potholing, and
      similar site work, as a service rather than a fabricated product.
    keywords:
      - "hydrovac"
      - "hydro excavation"
      - "hydro-excavation"
      - "hydroexcavation"
      - "hydrovac excavation"
      - "hydro vac"
      - "vacuum excavation"
      - "non-destructive excavation"
      - "soft dig"
      - "soft digging"
      - "potholing"
    naics_codes:
      - "238910"  # Site Preparation Contractors (standard NAICS for excavation, incl. hydrovac)
    psc_codes: []  # no PSC code added -- rather than guess one, this relies on NAICS + keywords
    nigp_codes:
      - "Excavation"
      - "Utility Locating"

# -----------------------------------------------------------------------------
# SAM.gov search parameters (federal, nationwide — no geographic filtering)
# -----------------------------------------------------------------------------
sam_gov:
  # NAICS codes worth pulling. Verify/adjust against https://www.naics.com
  # if your product mix shifts.
  naics_codes:
    - "332312"  # Fabricated Structural Metal Manufacturing
    - "332311"  # Prefabricated Metal Building and Component Manufacturing
    - "332313"  # Plate Work Manufacturing (ducts, plenums, housings)
    - "332322"  # Sheet Metal Work Manufacturing
    - "332420"  # Metal Tank (Heavy Gauge) Manufacturing
    - "332996"  # Fabricated Pipe and Pipe Fitting Manufacturing
    - "332999"  # All Other Miscellaneous Fabricated Metal Product Manufacturing
    - "336413"  # Other Aircraft Parts & Auxiliary Equipment Mfg (turbine-adjacent)
    - "333611"  # Turbine and Turbine Generator Set Units Manufacturing
    - "238120"  # Structural Steel and Precast Concrete Contractors
    - "238910"  # Site Preparation Contractors (standard NAICS for excavation, incl. hydrovac)

  # Product/Service Codes (federal contracting FSC/PSC families). These are a
  # starting point, not gospel — cross-check against SAM.gov's PSC list and
  # adjust. Keyword matching below is the real safety net since fabricated
  # metal work is frequently miscoded.
  psc_codes:
    - "5410"  # Prefabricated and Portable Buildings
    - "5411"  # Prefabricated Building Modules/Sections
    - "5420"  # Bridges, Fixed and Floating
    - "4730"  # Miscellaneous Pipe, Tube, Hose, and Fittings
    - "3441"  # Bending and Forming Machines
    # No PSC code added for hydrovac/excavation work -- rather than guess one,
    # coverage there relies on NAICS 238910 above plus the keyword list below.

  # How far back to look for newly posted/modified notices each run (days).
  lookback_days: 1

# -----------------------------------------------------------------------------
# Keyword matching — applied to title + description across ALL sources.
# This is what catches miscoded postings that NAICS/PSC filtering misses.
# Weight is added to the score for each distinct keyword matched (case-insensitive,
# word-boundary match). Tune freely; feedback.py layers small learned
# adjustments on top of these base weights, it never overwrites them.
# -----------------------------------------------------------------------------
keywords:
  high_value:      # strong signal this is squarely in our capability
    weight: 15
    terms:
      - "gas turbine duct"
      - "turbine duct"
      - "air inlet filter housing"
      - "inlet filter house"
      - "expansion joint"
      - "exhaust duct"
      - "inlet duct"
      - "weldment"
      - "structural steel fabrication"
      - "fabricated steel"
      - "metal fabrication"
      - "skid package"
      - "equipment skid"
      - "hydrovac"
      - "hydro excavation"
      - "hydro-excavation"
      - "hydroexcavation"
      - "hydrovac excavation"
      - "hydro vac"
      - "vacuum excavation"
      - "non-destructive excavation"
      - "soft dig"
      - "soft digging"
      - "potholing"

  medium_value:    # plausible fit, needs a human look
    weight: 8
    terms:
      - "duct"
      - "plenum"
      - "equipment housing"
      - "filter housing"
      - "enclosure"
      - "skid"
      - "steel structure"
      - "pressure vessel"
      - "tank fabrication"
      - "pipe spool"
      - "platform structure"
      - "equipment enclosure"

  low_value:       # generic, only worth a small nudge
    weight: 3
    terms:
      - "welding"
      - "steel"
      - "metal"
      - "fabrication"
      - "structural"

  negative:        # subtract points — usually a false-positive magnet
    weight: -20
    terms:
      - "janitorial"
      - "landscaping"
      - "food service"
      - "IT services"
      - "software"
      - "medical supplies"
      - "furniture"
      - "sole source"
      - "sole-source"   # federal notices announcing an award without competition — not something we can bid on

# -----------------------------------------------------------------------------
# Scoring weights — how much each factor contributes to the final 0-100 score.
# These are relative multipliers applied on top of the raw signals below;
# the keyword weights above already produce the base "relevance" component.
# -----------------------------------------------------------------------------
scoring:
  weights:
    keyword_relevance: 1.0   # multiplier on summed keyword score
    naics_psc_match: 20      # flat bonus if NAICS or PSC code matched directly
    contract_value: 1.0      # multiplier on the normalized value score (see below)
    set_aside_eligible: 10   # flat bonus if we qualify for the listed set-aside
    proximity: 1.0           # multiplier on normalized proximity score
    deadline_urgency: 1.0    # multiplier on normalized urgency score
    llm_relevance: 15        # bonus (scaled by the LLM's confidence 0-100%) when llm_scoring judges it relevant — see llm_scoring below
    capability_relevance: 1.0  # multiplier on the best-fitting capability's raw score — see capabilities above and capability_scoring below

  # Contract value scoring: log-scaled so a $50k job and a $50M job don't
  # collapse to the same bucket. Values outside this range are clamped.
  contract_value_curve:
    min_value: 10000
    max_value: 50000000
    max_points: 25

  # How a single capability profile's own signals (keywords + NAICS/PSC/NIGP
  # codes) turn into that capability's raw score before capability_relevance
  # above scales it. Also governs the graduated NAICS/PSC credit applied to
  # the flat sam_gov.naics_codes/psc_codes lists (naics_psc_match weight,
  # above): an exact code match gets full credit, a same-family/group match
  # (first naics_prefix_length digits, or first psc_prefix_length characters)
  # gets partial credit instead of nothing — codes are a graduated signal,
  # not a hard yes/no filter.
  capability_scoring:
    keyword_points_per_term: 10   # per distinct matched keyword within one capability
    max_keyword_points: 30        # cap so one capability with many keyword hits doesn't dominate
    code_match_points: 15         # points for the best of this capability's NAICS/PSC/NIGP credit
    naics_prefix_length: 4        # NAICS digits that define an industry group
    psc_prefix_length: 2          # PSC/FSC digits that define a supply group

  # Set-asides we can legitimately claim. Adjust to match your actual
  # certifications (SBA size standard, HUBZone, etc.) — do not claim ones
  # you don't qualify for.
  qualifying_set_asides:
    - "Total Small Business"
    - "SBA Small"
    - "None"        # unrestricted — always eligible

  # Proximity scoring only applies to state/local opportunities (federal is
  # nationwide by design and always scores full proximity points).
  proximity_curve:
    max_points: 15
    full_points_within_miles: 100   # anything closer than this gets max points
    radius_miles: 500               # points taper to 0 at the radius edge

  # Deadline urgency: more points as the response deadline approaches, up to
  # a point — too close to respond meaningfully gets slightly discounted.
  deadline_curve:
    max_points: 20
    sweet_spot_days: 10      # days-to-deadline that scores highest
    too_soon_days: 2         # inside this window, urgency score is discounted
    too_soon_penalty: 0.5

# -----------------------------------------------------------------------------
# Source toggles — flip a source off without deleting its module.
# -----------------------------------------------------------------------------
sources:
  sam_gov: true
  san_antonio: true
  austin: true
  oklahoma: true
  louisiana: true
  houston: true
  dallas_county: true
  wichita_falls: true
  dallas_bonfire: true
  # Phase 2 — not yet built:
  missouri: false
  # Not automated — brittle/login-walled/mid-migration/no actionable open-
  # opportunity feed/robots.txt disallows it. See README for the portal's own
  # email-alert signup as your supplement. TxDOT is here (not Phase 1)
  # because its only stable, structured data is *historical/awarded* bid
  # tabulations — not open solicitations — so it isn't a useful automated
  # opportunity source; the actual open letting schedule is PDF-only and
  # best tracked via TxDOT's GovDelivery alerts instead.
  txdot: false
  # TX ESBD/TxSmartBuy: the scraper works (confirmed against real page
  # structure) but www.txsmartbuy.com/robots.txt disallows ALL crawling
  # (User-agent: * / Disallow: /) — do not turn this on. Use the CMBL
  # vendor-notification signup instead (see README).
  tx_esbd: false
  # Dallas and Fort Worth (Bonfire): originally BOTH confirmed blocked
  # (dallascityhall.bonfirehub.com/robots.txt and
  # fortworthtexas.bonfirehub.com/robots.txt were User-agent: * / Disallow:
  # /, the same blanket opt-out as TX ESBD), which is why this project
  # long treated "Bonfire-hosted portal" as a hard stop regardless of
  # technical feasibility, on the assumption it was one platform-wide
  # policy. That assumption turned out to be wrong, or at least not
  # durable: re-checked live 2026-07-20, dallascityhall.bonfirehub.com's
  # robots.txt now reads `User-agent: * / Disallow:` (empty -- nothing
  # blocked), and its public "Opportunity RSS Feed"
  # (https://dallascityhall.bonfirehub.com/opportunities/rss -- an
  # intentionally public, Bonfire-documented feed, not a reverse-engineered
  # endpoint) was confirmed live with real current solicitations. See
  # src/sources/dallas_bonfire.py, now enabled above (`dallas_bonfire:
  # true`). fortworthtexas.bonfirehub.com was NOT re-checked as part of
  # this -- one Bonfire org relaxing its policy is not evidence another
  # did, so Fort Worth (and every other Bonfire-family portal below: Harris
  # County, San Angelo, Tarrant County/Ion Wave) stays disabled until each
  # is individually re-checked against its own live robots.txt, same
  # discipline as every other source in this project. Also still true as
  # of the original check (2026-07): fortworthtexas.gov (a separate domain
  # from fortworthtexas.bonfirehub.com) returns "Access Denied" from
  # Akamai's bot-mitigation layer regardless of robots.txt -- a different,
  # tougher signal, treated the same way: not something to route around.
  fort_worth_bonfire: false
  # NOTE: Dallas COUNTY is a separate government entity from the City of
  # Dallas above, with its own domain (dallascounty.org) and a working
  # source -- see `dallas_county: true` in the active list up top. Don't
  # confuse the two: City of Dallas is now `dallas_bonfire: true` (RSS
  # feed) above; Dallas County (its own view-and-download page) is a
  # separate, also-live source.
  arkansas_egp: false
  # Tarrant County (Fort Worth's county) uses Ion Wave, a different
  # eProcurement vendor than Bonfire -- but Ion Wave, Bonfire, EqualLevel,
  # and DemandStar are all now under one parent company (Euna Procurement),
  # and CONFIRMED (2026-07): tarrantcountytx.ionwave.net/robots.txt is an
  # identical blanket `Disallow: /`. The listing page itself is a perfectly
  # real, scrapable ASP.NET Telerik grid with genuine current bids -- not
  # built anyway, same principle as Dallas/Fort Worth's Bonfire block.
  # Assume any other Euna-family platform (Bonfire, Ion Wave, EqualLevel,
  # DemandStar) has this same policy until individually checked.
  tarrant_county_ionwave: false
  # Harris County (Houston's county): also Bonfire (harriscountytx.bonfirehub.com),
  # CONFIRMED same blanket robots.txt block as every other Euna-family portal.
  # Unlike Dallas County, Harris County's own domain
  # (purchasing.harriscountytx.gov) has no standalone public listing to
  # fall back on -- its "Bids-Proposals" and "Online Solicitation
  # Opportunities" pages are just navigation/marketing content that link
  # straight back to the blocked Bonfire portal, and its separate
  # "Current Project Status" page redirects to a login wall. Dead end.
  harris_county: false
  # San Angelo: also Bonfire (cosatx.bonfirehub.com), CONFIRMED same
  # blanket robots.txt block -- 7th Bonfire subdomain checked this session,
  # 7th blocked. City's own domain has no fallback listing either.
  san_angelo: false
  # Corpus Christi: split across two platforms, neither pursued further.
  # "Capital Procurements" -> CivCast (civcastusa.com), an AngularJS SPA
  # (raw HTML is just a loading shell) whose robots.txt IS permissive --
  # same DevTools-reverse-engineering approach that worked for Houston
  # could apply here, but CivCast's own site says a new platform version
  # is coming (mid-migration, same instability concern that deprioritized
  # Arkansas), so not worth the effort for one city right now. "Operational
  # Procurements" -> an unidentified "Supplier Portal" -- couldn't even
  # determine which vendor platform this is from the public page.
  corpus_christi: false
  new_mexico: false
  kansas_esupplier: false

# -----------------------------------------------------------------------------
# Source URLs — all three active ones (sam_gov's endpoint is hardcoded, not
# listed here) have been confirmed against real fetched pages. If a source's
# parser starts returning 0 results, this is the first thing to check: visit
# the URL yourself, confirm it still resolves, and update it here if the
# site has moved. See README "Debugging a source" section.
# -----------------------------------------------------------------------------
source_urls:
  tx_esbd: "https://www.txsmartbuy.com/esbd"  # disabled (robots.txt) — kept for reference
  san_antonio: "https://webapp1.sanantonio.gov/BidContractOpps/Default.aspx"
  austin: "https://financeonline.austintexas.gov/afo/account_services/solicitation/solicitations.cfm"
  oklahoma: "https://www.ok.gov/dcs/solicit/app/solicitationSearch.php?status=open-pending"
  louisiana: "https://wwwcfprd.doa.louisiana.gov/osp/lapac/srchopen.cfm?deptno=all&catno=all&dateStart=&dateEnd=&compareDate=O&keywords=&keywordsCheck=all"
  dallas_county: "https://www.dallascounty.org/departments/purchasing/current-business-ops.php"
  wichita_falls: "https://www.wichitafallstx.gov/Bids.aspx"
  dallas_bonfire: "https://dallascityhall.bonfirehub.com/opportunities/rss"

email:
  digest_min_score_to_include: 25   # opportunities scoring below this are dropped entirely
  max_items_per_digest: 40

# -----------------------------------------------------------------------------
# LLM-based relevance judgment — an optional second opinion layered on top of
# the deterministic keyword/NAICS scoring above. It can (a) rescue a genuine
# fit that happens to use none of the configured keywords, and (b) writes the
# plain-English "why this is a good fit" reason shown in the digest, instead
# of just a matched-keyword list.
#
# Requires ANTHROPIC_API_KEY in .env — get one at https://console.anthropic.com
# (Settings -> API Keys). Degrades gracefully to keyword/NAICS-only scoring if
# the key isn't set, so this is fully optional; nothing else in the project
# depends on it.
#
# Rough cost estimate (Haiku, at typical volume of a few dozen to ~150
# opportunities/day): well under $1/day. This is a rough estimate, not a
# quote — check https://www.anthropic.com/pricing for current rates.
# -----------------------------------------------------------------------------
llm_scoring:
  enabled: true
  model: "claude-haiku-4-5"

# -----------------------------------------------------------------------------
# Semantic similarity scoring — an optional third signal, layered on top of
# the deterministic keyword/NAICS/capability scoring above and independent
# of llm_scoring. For each opportunity, compares its text (via Voyage AI
# text embeddings) against every capability's `description` above and adds
# a similarity-scaled bonus to that capability's score — this is what lets
# a genuine fit that's phrased nothing like any configured keyword, code,
# or capability description still surface (e.g. "gas turbine exhaust
# plenum assembly" scoring well against "Turbine ducts, filter housings &
# expansion joints" on meaning alone).
#
# Anthropic doesn't serve embeddings directly -- this uses Voyage AI (see
# src/semantic.py). Requires VOYAGE_API_KEY in .env — get one at
# https://dashboard.voyageai.com. Degrades gracefully to
# keyword/NAICS/capability-code-only scoring if the key isn't set or a call
# fails, so this is fully optional; nothing else in the project depends on
# it.
# -----------------------------------------------------------------------------
semantic_scoring:
  enabled: false
  model: "voyage-3.5"
  max_points: 25          # ceiling on the semantic-similarity bonus added to a capability's score
  min_similarity: 0.3     # cosine similarity at/below this floor contributes 0 (Voyage similarities for unrelated text rarely go below ~0.2-0.3)
